/*
 * Settings for the MCAgents chat multi project build.
 *
 * The root project is named `mcagents-chat` rather than `chat`, which is what
 * gives the published modules their `mcagents-chat-api` and
 * `mcagents-chat-common` artifact ids. A bare `chat` would publish
 * `io.github.mcagents:api` and collide with MCAgents/core in the same group.
 */

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mcagents-chat'

// Pure Java layers. Everything else compiles against these two and never the
// other way around.
include 'api'
include 'common'

// Bukkit family, all under `platforms/bukkit`. `platforms:bukkit:core` holds
// the code the three server entry points share; each entry point sits beside
// it and adds only what its own server needs.
include 'platforms:bukkit:core'
include 'platforms:bukkit:spigotmc'
include 'platforms:bukkit:papermc'
include 'platforms:bukkit:foliamc'

// Mod loader family, all under `platforms/mods`, mirroring the Bukkit family's
// shape. `platforms:mods:core` holds what every mod module shares; `client`
// and `server` hold the two physical sides, which the loaders never mix; the
// loader entry points add only what NeoForge or Fabric itself needs.
include 'platforms:mods:core'
include 'platforms:mods:client'
include 'platforms:mods:server'
include 'platforms:mods:neoforge'
include 'platforms:mods:fabric'

// The universal entry point. It is the only module that implements every other
// module, so a single artifact carries the whole plugin.
include 'platforms:engine'
