/*
 * Settings for the MCAgents chat multi project build.
 *
 * The root project is named `mcagents-chat` rather than `chat`, which is what
 * gives the published modules their `mcagents-chat-api` and
 * `mcagents-chat-common` artifact ids. A bare `chat` would publish
 * `io.github.mcagents:api` and collide with MCAgents/core in the same group.
 */

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mcagents-chat'

// Pure Java layers. Everything else compiles against these two and never the
// other way around.
include 'api'
include 'common'

// Bukkit family. `platforms:bukkit` holds the code the three server entry
// points share; each entry point adds only what its own server needs.
include 'platforms:bukkit'
include 'platforms:spigotmc'
include 'platforms:papermc'
include 'platforms:foliamc'

// Mod loader family. `platforms:mods` holds the code the loader entry points
// share, mirroring the role `platforms:bukkit` plays for the server side.
include 'platforms:mods'
include 'platforms:neoforge'
include 'platforms:fabric'

// The universal entry point. It is the only module that implements every other
// module, so a single artifact carries the whole plugin.
include 'platforms:engine'
