name: MCAgentsChat
version: '${version}'
main: io.github.mcagents.chat.foliamc.FoliaMCChatPlugin
api-version: '1.21'
description: In-game AI chat for MCAgents.
authors: [jetsadawijit]
website: https://mcagents.github.io/website

# The bridge resolves MCAgents core's API through that plugin's own
# classloader. This declaration is what guarantees core loads first and makes
# its classes reachable; without it the bridge cannot resolve.
depend: [MCAgents]
folia-supported: true

commands:
  chat:
    description: Ask the AI a question, or manage the chat plugin.
    usage: /chat <message> | /chat clear | /chat reload

permissions:
  mcagents.chat.use:
    description: Allows a player to use /chat. Only takes effect when player_allow is true in config.yml.
    default: false
  mcagents.chat.reload:
    description: Allows running /chat reload, which re-reads config.yml and drops every conversation.
    default: op
