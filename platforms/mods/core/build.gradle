plugins {
    id 'java-library'
}

dependencies {
    // The shared layers are bundled once, by the engine. Every module below
    // the engine declares them compileOnly so no jar carries a second copy.
    compileOnly project(':api')
    compileOnly project(':common')

}

// No mod loader coordinate is declared here. This module is the loader
// agnostic half of the mod side — the part that holds only plain Java. The
// loader toolchains (ModDevGradle for NeoForge, Loom for Fabric) are
// introduced by the modules that actually need them, in the change that adds
// real loader code.

dependencies {
    // `compileOnly` does not reach the test compile classpath, so what this
    // module compiles against is declared again for the tests.
    testImplementation project(':api')
    testImplementation project(':common')
}

base {
    archivesName = "${rootProject.name}-mods"
}
